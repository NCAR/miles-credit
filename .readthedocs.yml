# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

    # You can also specify other tool versions:
    # nodejs: "19"
    # rust: "1.64"
    # golang: "1.19"

  # Install with uv instead of pip: pip's resolve + install of the full dependency
  # stack (.[docs]) was the slowest build step and where slow builds stalled.
  # CPU-only torch skips the multi-GB CUDA wheels, which the docs never need.
  # See https://docs.readthedocs.io/en/stable/build-customization.html#install-dependencies-with-uv
  jobs:
    # Diagnostics for builds being terminated "due to inactivity": log the VM's CPU, memory and disk.
    post_checkout:
      - nproc; free -h; df -h .
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - uv pip install --python "${READTHEDOCS_VIRTUALENV_PATH}/bin/python" --torch-backend cpu ".[docs]"
    pre_build:
      - free -h; df -h .
    # TEST: since ~2026-11-12 20:25 UTC RTD kills any single build command that runs longer than
    # ~60 s ("terminated due to inactivity"). Run Sphinx (the default RTD command, plus -v) in the
    # background and wait for it in short steps; each step saves the tail of Sphinx's log.
    build:
      html:
        - >-
          nohup setsid sh -c '"${READTHEDOCS_VIRTUALENV_PATH}/bin/python" -m sphinx -T -v -b html
          -d docs/source/_build/doctrees -D language=en docs/source "${READTHEDOCS_OUTPUT}/html";
          echo $? > /tmp/sphinx.rc' > /tmp/sphinx.log 2>&1 < /dev/null &
        - &wait_sphinx 'for i in $(seq 8); do [ -f /tmp/sphinx.rc ] && break; sleep 5; done; tail -n 15 /tmp/sphinx.log'
        - *wait_sphinx
        - *wait_sphinx
        - *wait_sphinx
        - *wait_sphinx
        - *wait_sphinx
        - *wait_sphinx
        - *wait_sphinx
        - *wait_sphinx
        - *wait_sphinx
        - *wait_sphinx
        - *wait_sphinx
        - >-
          tail -n 60 /tmp/sphinx.log;
          [ -f /tmp/sphinx.rc ] || { echo "Sphinx still running after the wait steps"; exit 1; };
          exit "$(cat /tmp/sphinx.rc)"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/source/conf.py

# Optionally build your docs in additional formats such as PDF and ePub
# formats:
#    - pdf
#    - epub
