# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

    # You can also specify other tool versions:
    # nodejs: "19"
    # rust: "1.64"
    # golang: "1.19"

  # Install with uv instead of pip: pip's resolve + install of the full dependency
  # stack (.[docs]) was the slowest build step and where slow builds stalled.
  # CPU-only torch skips the multi-GB CUDA wheels, which the docs never need.
  # See https://docs.readthedocs.io/en/stable/build-customization.html#install-dependencies-with-uv
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - uv pip install --python "${READTHEDOCS_VIRTUALENV_PATH}/bin/python" --torch-backend cpu ".[docs]"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/source/conf.py

# Optionally build your docs in additional formats such as PDF and ePub
# formats:
#    - pdf
#    - epub
