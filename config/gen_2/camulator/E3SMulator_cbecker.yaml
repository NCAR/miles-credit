# ---- Model architecture ---- #
# Must match the checkpoint — do not edit for the shipped model.
model:
  type: "camulator"
  frames: 1
  image_height: 192
  image_width: 288
  levels: 72
  channels: 4               # 3D prognostic: U V T Q
  surface_channels: 8       # 2D prognostic: PS TREFHT
  input_only_channels: 7    # dynamic_forcing (4) + static (3)
  output_only_channels: 19  # diagnostic variables

  patch_width: 1
  patch_height: 1
  frame_patch_size: 1

  dim: [256, 512, 1024, 2048]
  depth: [2, 2, 18, 2]
  global_window_size: [4, 4, 2, 1]
  local_window_size: 3
  cross_embed_kernel_sizes:
    - [4, 8, 16, 32]
    - [2, 4]
    - [2, 4]
    - [2, 4]
  cross_embed_strides: [2, 2, 2, 2]
  attn_dropout: 0.
  ff_dropout: 0.

  use_spectral_norm: True
  interp: True

  padding_conf:
    activate: True
    mode: earth
    pad_lat: [48, 48]
    pad_lon: [48, 48]


# ---- Loss ---- #
#loss:
#  training_loss: "mse"
#
#  use_power_loss: False
#  use_spectral_loss: False
#  spectral_lambda_reg: 0.1
#  spectral_wavenum_init: 20
#
#  latitude_weights: "/global/cfs/cdirs/m5388/cbecker/metadata/b.e21.CREDIT_climate.statics_1.0deg_32levs_latlon_F32_hyai_fixed.nc"
#  use_latitude_weights: True
#
#  use_variable_weights: False

loss:
  type: base
  args:
    training_loss: "mse"              # univariate loss per variable (mse | mae | huber | logcosh | ...)
    base_loss_parameters: {}
    # base_loss_overrides:            # optional per-variable univariate loss
    #   ERA5/diagnostic/2d/total_precipitation: {loss: "mae"}

    # Physical-unit variables differ wildly in variance (SP ~1e5 Pa vs q ~1e-2);
    # inverse_variance weights each variable by 1/sigma^2 from the bridgescaler
    # file (approximates normalized-space training). Options:
    # inverse_variance | manual | learnable | none
    var_weighting: "inverse_variance"
    scaler_path: *bs_pre_json
    variable_weights:                 # manual multipliers per var_key (all modes)
      # The scaler holds PRECT's sqrt-space variance (1.816e-08) but the loss scores PRECT in m/s
      # (variance 6.578e-15, below the 1e-12 floor). var_sqrt / var_phys turns the weight into
      # 1 / var_phys = 1.52e14. From the 2,000-sample diagnostic; recompute from the fitted scaler if wanted.
      'E3SM_ATM/diagnostic/2d/PRECT': 2.76e+6
    normalize_weights: false          # true divides by the mean weight and shrinks the loss to ~1e-9

    # Data diagnostic variables are always scored; postblock-computed
    # diagnostics (e.g. from mslp_diagnostic) only when true.
    include_computed_diagnostics: false
    use_latitude_weights: True        # cos(lat) spatial weighting per variable
    latitude_weights: &lat_weights_file "/global/cfs/cdirs/m5388/cbecker/metadata/b.e21.CREDIT_climate.statics_1.0deg_32levs_latlon_F32_hyai_fixed.nc"

metrics:
  type: combined
  args:
    metrics:                          # registry names of univariate metrics
      rmse: {}
      r2score: {}
      bias: {}
    # To score a variable with a different functional, add that metric to the
    # list above — each entry scores every variable under its own namespace
    # (e.g. "mae/ERA5/..."). There is no per-variable metric override: unlike
    # the loss, a combined metric has no single "base" metric to override.

    # Physical-unit variables differ wildly in variance (SP ~1e5 Pa vs q ~1e-2);
    # inverse_variance divides each variable by sigma**scale_power, using the
    # bridgescaler file. scale_power is a property of the metric, so the
    # aggregate is dimensionless whatever its order: 2 for mse, 1 for rmse/mae/
    # bias/activity, and 0 for already-normalized scores like r2score/acc
    # (which ignore the scaler entirely).
    # Options: inverse_variance | manual | none (no learnable for metrics).
    var_weighting: "inverse_variance"
    scaler_path: *bs_pre_json
    # No PRECT entry: these weights only form the aggregate score (per-variable columns are unweighted),
    # and one multiplier cannot be right for rmse/bias (sigma**1) and r2score (sigma**0) at once. PRECT's
    # share of the aggregate rmse/bias uses its sqrt-space sigma; read its per-variable columns instead.
    variable_weights: {}              # manual multipliers per var_key (all modes)
    normalize_weights: false

    include_computed_diagnostics: false

    use_latitude_weights: True        # cos(lat) spatial weighting per variable
    latitude_weights: *lat_weights_file

# ---- Inference ---- #
# run_mode selects between batch and single forecast.
#   batch:  generates forecasts for a range of init times defined under batch_forecast.initialization
#   single: runs one forecast from a specific init time defined under single_forecast.start_datetime
inference:
  run_mode: single
  mode: none                          # none | ddp | fsdp
  save_forecast: '/global/common/software/m5388/kjmayer/CREDIT_runs/subE3SMulator/rollout/'

  batch_forecast:
    forecast_length: "45d"                    # 1 no-leap year
    first_init_date: "2026-01-01"
    last_init_date: "2039-12-31"
    init_interval: "1w"

  single_forecast:
    forecast_length: "30d"                    # 1460 6-hourly steps = 1 no-leap year
    start_datetime: "1995-01-01T00:00Z"

  output:
    format: netcdf
    output_interval: null
    group_by: month
    metadata: "/global/cfs/cdirs/m5388/cbecker/metadata/camulator_metadata.yaml"
    variables:
#      - name: "CESM/prognostic/3d/U"
#      - name: "CESM/prognostic/3d/V"
#      - name: "CESM/prognostic/3d/T"
#      - name: "CESM/prognostic/3d/Qtot"
      - name: "CESM/prognostic/2d/PS"
      - name: "CESM/prognostic/2d/TREFHT"
      - name: "CESM/diagnostic/2d/PRECT"
      - name: "CESM/diagnostic/2d/TS"
      - name: "CESM/diagnostic/2d/CLDHGH"
      - name: "CESM/diagnostic/2d/CLDLOW"
      - name: "CESM/diagnostic/2d/CLDMED"
      - name: "CESM/diagnostic/2d/TAUX"
      - name: "CESM/diagnostic/2d/TAUY"
      - name: "CESM/diagnostic/2d/U10"
      - name: "CESM/diagnostic/2d/QFLX"
      - name: "CESM/diagnostic/2d/SHFLX"
      - name: "CESM/diagnostic/2d/LHFLX"
      - name: "CESM/diagnostic/2d/FSDS_J"
      - name: "CESM/diagnostic/2d/FLDS_J"
      - name: "CESM/diagnostic/2d/FSUS"
      - name: "CESM/diagnostic/2d/FLUS"
      - name: "CESM/diagnostic/2d/FSUTOA"
      - name: "CESM/diagnostic/2d/FLUT"
    encoding:
      dtype: float32
      zlib: true
      complevel: 0

slurm:
  # Read by `credit submit --cluster perlmutter --scheduler slurm --mode preprocess|train`, which writes
  # the sbatch script (torchrun on 4 GPUs) under save_loc/slurm_scripts/ and logs under save_loc/logs/.
  conda: "/global/common/software/m5388/cbecker/envs/credit"
  project: "m5388_g"
  job_name: "e3sm_scaling_test"
  nodes: 1
  ngpus: 4
  ncpus: 128               # Perlmutter counts hardware threads: 128 = the whole GPU node
  walltime: "04:00:00"
  qos: "regular"           # debug caps walltime at 30 min
  constraint: "gpu"
  env_setup:
    - "export NCCL_DEBUG=INFO"
