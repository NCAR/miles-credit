                - 'E3SM_ATM/dynamic_forcing/2d/co2vmr_3d'
                - 'E3SM_ATM/dynamic_forcing/2d/SOLIN'
                - 'E3SM_ATM/dynamic_forcing/2d/TLAI'
                - 'E3SM_ATM/prognostic/3d/U'
                - 'E3SM_ATM/prognostic/3d/V'
                - 'E3SM_ATM/prognostic/3d/T'
                - 'E3SM_ATM/prognostic/3d/Q'
                - 'E3SM_ATM/prognostic/2d/TS'
                - 'E3SM_ATM/prognostic/2d/SST'
