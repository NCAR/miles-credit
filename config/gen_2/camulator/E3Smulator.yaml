# Gen2 config for the subE3SMulator model (CESM-coupled climate emulator).
#   - Single GPU, no physics post-blocks (those come in a follow-up)
#   - 2-year training window (1980-1981), 1-year validation (2013)
#   - Reduced batch/epoch counts for fast iteration
#
# BridgeScaler JSONs generated from gen1 mean/std NetCDF via `credit convert`:
#   pre:  /glade/derecho/scratch/schreck/credit_tests/camulator_gen2/camulator_pre_scaler.json
#   post: /glade/derecho/scratch/schreck/credit_tests/camulator_gen2/camulator_post_scaler.json
# ===================================================================================================================== #

save_loc: '/global/cfs/cdirs/m5388/cbecker/CREDIT_runs/subE3SMulator/'
seed: 1000
# ---- Training/validation data ---- #
# Paths under each variable group are TRAINING-ONLY (ignored by Quick_Climate inference).
data:
  source: &data_sources
    E3SM_ATM: # ncol size: 21600
      dataset_type: "local"
      level_coord: "lev"
      variables:
        prognostic:
          vars_3D:
              - 'U'
              - 'V'
              - 'T'
              - 'Q'
          vars_2D:
              - 'PS'
              - 'TS'
              - 'SST'
          path: '/global/cfs/cdirs/mp9/E3SMv2.1-subE3SMulator/creditformat/v21.LR.subE3SMulator.001.eam.h1.h2.%Y.nc'
        diagnostic:
          vars_2D:
              - 'PRECT'
              - 'TREFHT'
              - 'CLDTOT'
              - 'TAUX'
              - 'TAUY'
              - 'U10'
              - 'Z500'
              - 'OMEGA850'
              - 'OMEGA200'
              - 'QFLX'
              - 'FLUT'
              - 'FSNS'
              - 'FLNS'
              - 'FSNT'
              - 'FLNT'
              - 'SHFLX'
              - 'LHFLX'
          path: '/global/cfs/cdirs/mp9/E3SMv2.1-subE3SMulator/creditformat/v21.LR.subE3SMulator.001.eam.h1.h2.%Y.nc'
        dynamic_forcing:
          vars_2D:
              - 'SOLIN'
              - 'co2vmr_3d'
              - 'TLAI'
          path: "/global/cfs/cdirs/mp9/E3SMv2.1-subE3SMulator/creditformat/dynamicforcing_%Y.nc"

        static:
          vars_2D:
              - 'PHIS'
              - 'landfrac'
              - 'ZTOP_CANOPY'
              - 'ZBOT_CANOPY'
          path: '/global/cfs/cdirs/mp9/E3SMv2.1-subE3SMulator/creditformat/staticforcing.nc'

    E3SM_OCN: # nCells = 236853 (missing coordinate data)
      dataset_type: "local"
      coordinate_file: "/global/cfs/cdirs/m5388/cbecker/metadata/EC30to60E2r2.scrip.201005.nc"
      lat_name: 'grid_center_lat'
      lon_name: 'grid_center_lon'
      variables:
        prognostic:
          vars_2D:
              - 'SSS'
          path: '/global/cfs/cdirs/mp9/E3SMv2.1-subE3SMulator/creditformat/v21.LR.subE3SMulator.001.mpaso.hist.am.6hr.%Y.nc'

        diagnostic:
          vars_2D:
              - 'dMLD'
          path: '/global/cfs/cdirs/mp9/E3SMv2.1-subE3SMulator/creditformat/v21.LR.subE3SMulator.001.mpaso.hist.am.6hr.%Y.nc'

    E3SM_ICE: # nCells = 236853 (missing coordinate data)
      dataset_type: "local"
      coordinate_file: "/global/cfs/cdirs/m5388/cbecker/metadata/EC30to60E2r2.scrip.201005.nc"
      lat_name: 'grid_center_lat'
      lon_name: 'grid_center_lon'
      variables:
        prognostic:
          vars_2D:
              - 'sithick'
          path: '/global/cfs/cdirs/mp9/E3SMv2.1-subE3SMulator/creditformat/v21.LR.subE3SMulator.001.mpassi.hist.am.6hr.%Y.nc'

    E3SM_LND: # nCols = 21600
      dataset_type: "local"
      variables:
        prognostic:
          vars_2D:
              - 'SOILWAT_2m'
              - 'TSOI_2m'
              - 'SNOWDP'
          path: '/global/cfs/cdirs/mp9/E3SMv2.1-subE3SMulator/creditformat/v21.LR.subE3SMulator.001.elm.h1.%Y.withtop2m.negclip.nc'

        diagnostic:
          vars_2D:
              - 'QRUNOFF'
          path: '/global/cfs/cdirs/mp9/E3SMv2.1-subE3SMulator/creditformat/v21.LR.subE3SMulator.001.elm.h1.%Y.withtop2m.negclip.nc'


  date_ranges:
      - ["1951-01-01", "1999-12-31"]
      - ["2010-01-01", "2024-12-31"]
      - ["2041-01-01", "2050-12-31"]
  timestep: "6h"


  history_len: 1
  forecast_len: 1

  one_shot: True
  lead_time_periods: 6
  skip_periods: null


# ---- Validation data ---- #
validation_data:
  source: *data_sources
  date_ranges:
      - ["2000-01-01", "2009-12-31"]
  timestep: "6h"
  history_len: 1
  forecast_len: 1
  one_shot: True
  lead_time_periods: 6
  skip_periods: null

# ---- Training hyperparameters ---- #
trainer:
  type: gen2

  parallelism:
    data: none               # ddp | fsdp2 | none
    tensor: 1
    domain: 1

  cpu_offload: False
  activation_checkpoint: True

  load_weights: False
  load_optimizer: False
  load_scaler: False
  load_scheduler: False
  reload_epoch: False

  skip_validation: True
  update_learning_rate: True

  save_backup_weights: True
  save_best_weights: True
  save_every_epoch: True

  save_metric_vars: ["PRECT", "TREFHT", "SOILWAT_2m", "TSOI_2m", "U", "T", "SST", "SSS"]

  learning_rate: 1.0e-04
  weight_decay: 0

  train_batch_size: 2
  valid_batch_size: 2

  batches_per_epoch: 3
  valid_batches_per_epoch: 3
  stopping_patience: 5000

  start_epoch: 0
  num_epoch: 2
  epochs: &epochs 2

  use_tensorboard: True
  use_ema: False

  use_scheduler: False
  scheduler:
    scheduler_type: cosine-annealing
    T_max: *epochs
    last_epoch: -1

  amp: False
  grad_accum_every: 1
  grad_max_norm: 1.0

  thread_workers: 4
  valid_thread_workers: 4
  prefetch_factor: 2


# ---- Preblocks / Postblocks ---- #
# Preblocks run before the model; postblocks run after each forward pass.
# scaler (BridgeScaler) normalizes inputs/targets before the model and
# denormalizes outputs after. concat assembles the nested variable dict into
# the flat (B, C, H, W) tensor the model expects. reconstruct is required
# for forecast_len > 1 rollout.
preblocks:
  ic_only:
    atmlndregrid:
        type: "regrid"
        args:
            weight_file: "/global/cfs/cdirs/m5388/cbecker/metadata/fe30_to_cesm.nc"
            variables:
                - 'E3SM_ATM/static/2d/PHIS'
                - 'E3SM_ATM/static/2d/landfrac'
