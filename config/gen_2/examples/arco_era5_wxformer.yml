save_loc: "/glade/derecho/scratch/$USER/credit_models/arcoera5_wxformer/"
seed: 2525

data:
  source: &data_sources
    ERA5:
      dataset_type: "arcoera5"
      levels: []
      level_coord: "level"
      variables:
        prognostic:
          vars_3D: ["temperature",
                    "specific_humidity",
                    "fraction_of_cloud_cover",
                    "u_component_of_wind",
                    "v_component_of_wind",]
          vars_2D: ["surface_pressure",
                    "2m_temperature",
                    "2m_dewpoint_temperature",
                    "10m_u_component_of_wind",
                    "10m_v_component_of_wind",
                    "skin_temperature"]
        diagnostic:
          vars_2D: ["total_precipitation",
                    "snowfall",
                    "evaporation", 
                    "top_net_thermal_radiation", 
                    "top_net_solar_radiation",
                    "surface_latent_heat_flux", 
                    "surface_net_solar_radiation",
                    "surface_net_thermal_radiation", 
                    "surface_sensible_heat_flux"]
        dynamic_forcing: null
        static:
          vars_2D: ["geopotential_at_surface",
                    "standard_deviation_of_orography",
                    "land_sea_mask",
                    "low_vegetation_cover",
                    "high_vegetation_cover",
                    "leaf_area_index_high_vegetation",
                    "leaf_area_index_low_vegetation",
                    "sea_ice_cover",
                    "anisotropy_of_sub_gridscale_orography",
                    "angle_of_sub_gridscale_orography"
                   ]
    SOLAR:
      dataset_type: "tisr"
      num_integration_steps: 2160
      lat_spec: [ 90, -90, 721 ]          # [start, end, num_points], inclusive
      lon_spec: [ 0, 359.75, 1440 ]
      variables:
        prognostic: null
        diagnostic: null
        dynamic_forcing:
          vars_2D: ['tisr']
  start_datetime: "1979-01-01"
  end_datetime: "2018-12-31"
  timestep: "6h"

  history_len: 1
  forecast_len: 1


# ---- Validation data ---- #
# Reuses the ERA5 + SOLAR source definitions from data.source above via YAML
# anchors. Only the date range differs.
validation_data:
  source: *data_sources

  start_datetime: "2019-01-01"
  end_datetime: "2020-12-31"
  timestep: "6h"

  history_len: 1            # must match the training data block's history_len
  forecast_len: 1

trainer:
  type: gen2

  parallelism:
    data: fsdp2
    tensor: 1
    domain: 1

  activation_checkpoint: True

  load_weights: False
  load_optimizer: False
  load_scaler: False
  load_scheduler: False
  reload_epoch: False

  skip_validation: False
  update_learning_rate: True

  save_backup_weights: True
  save_best_weights: True

  learning_rate: 1.0e-3
  weight_decay: 0

  train_batch_size: 1
  valid_batch_size: 4

  batches_per_epoch: 10
  valid_batches_per_epoch: 10
  stopping_patience: 999

  start_epoch: 0
  num_epoch: 2
  epochs: &epochs 2

  use_tensorboard: True
  use_ema: True
  ema_decay: 0.9999

  use_scheduler: True
  scheduler:
    scheduler_type: linear-warmup-cosine
    warmup_steps: 1000
    total_steps: 500000  # ~ batches/epoch × total epochs
    min_lr: 1.0e-5

  amp: False
  grad_accum_every: 1
  grad_max_norm: 'dynamic'

  thread_workers: 4
  valid_thread_workers: 4
  prefetch_factor: 4

preblocks:
  per_step:
    fill_vals:
      type: "fill_values"
      args:
        rules:
          - search: nan        # NaN       → 0.0
            fill: 0.0
        variables: ["ERA5/static/2d/sea_ice_cover"]
    log_trans:
      type: "log_transform"
      args:
        variables: &log_vars ["ERA5/prognostic/3d/specific_humidity",
                    "ERA5/prognostic/2d/surface_pressure",
                    ]
    scaler:
      type: bridgescaler_transform
      args:
        scaler_path: &scaler_path "/glade/derecho/scratch/$USER/credit_models/arcoera5_wxformer/standard_scaler.json"
        data_types: ["input", "target"]
        variables: []
        scaler_type: "standard"
        scaler_params:
          channels_last: False
        method: transform
    concat:
      type: concat

postblocks:
  per_step:
    reconstruct:
      type: reconstruct
    scaler:
      type: bridgescaler_transform
      args:
        scaler_path: *scaler_path
        variables: []
        scaler_type: "standard"
        scaler_params:
          channels_last: False
          method: inverse_transform
    log_trans:
      type: "exp_transform"
      args:
        variables: *log_vars
    geopotential:
      type: "geopotential_diagnostic"
      args:
        output_name: "ERA5/computed_diagnostic/3d/geopotential"
        surface_geopotential_var: "ERA5/static/2d/geopotential_at_surface"
        surface_pressure_var: "ERA5/prognostic/2d/surface_pressure"
        temperature_var: "ERA5/prognostic/3d/temperature"
        specific_humidity_var: "ERA5/prognostic/3d/specific_humidity"
        flip_vertical: True
        level_info_file: "ERA5_Lev_Info.nc"
        model_a_half_var: "a_half"
        model_b_half_var: "b_half"
        key: "y_processed"
        static_source_key: "ic_raw"
        chunk_size: 1000


model:
  type: "wxformer"
  frames: 1
  image_height: 721
  image_width: 1440
  levels: 137
  channels: 5
  surface_channels: 6
  input_only_channels: 11
  output_only_channels: 9

  dim: [256, 256, 256, 256]
  depth: [2, 2, 2, 2]

  global_window_size: [8, 4, 2, 1]
  local_window_size: 4

  cross_embed_kernel_sizes:
    - [4, 8, 16, 32 ]
    - [4, 4]
    - [4, 4]
    - [4, 4]
  cross_embed_strides: [2, 2, 2, 2]
  attn_dropout: 0.
  ff_dropout: 0.

  interp: False
  use_spectral_norm: True
  upsample_with_ps: True

  # Padding must make the padded grid divisible by 64 so that after 4 stride-2
  # downsamples every stage is divisible by both local_window_size (4) and the
  # per-stage global_window_size ([8,4,2,1]).
  #   padded H = 721 + 23 + 24 = 768  (= 64 * 12)
  #   padded W = 1440 + 16 + 16 = 1472 (= 64 * 23)
  # Stage dims (H x W): 384x736 -> 192x368 -> 96x184 -> 48x92, all divisible.
  padding_conf:
    activate: True
    mode: earth
    pad_lat: [ 23, 24 ]
    pad_lon: [ 16, 16 ]

loss:
  type: base
  args:
    training_loss: "mse"
    var_weighting: "inverse_variance"
    base_loss_parameters: {}
    scaler_path: *scaler_path
    normalize_weights: true
    include_computed_diagnostics: true
    use_latitude_weights: false

pbs: #derecho
  conda: "credit-derecho"
  project: "NAML0001"
  job_name: "wxformer_arco_6hr_gen2"
  walltime: "12:00:00"
  nodes: 4
  ncpus: 64
  ngpus: 4
  mem: '480GB'
  queue: 'main'







          