# Smoke test — WXFormerNextLooped (input-conditioned recurrent bottleneck refinement),
# same data/preblock/postblock/loss/trainer setup as smoke_gen2_casper.yml (the canonical
# gen2 CLI smoke config) so this exercises exactly one new variable: the model itself.

save_loc: '/glade/derecho/scratch/$USER/credit_tests/smoke_wxformer_next_looped'
seed: 1000

data:
  source:
    ERA5:
      dataset_type: "local"
      level_coord: "level"
      levels: [10, 30, 40, 50, 60, 70, 80, 90, 95, 100, 105, 110, 120, 130, 136, 137]
      variables:
        prognostic:
          vars_3D: ["U", "V", "T", "Q"]
          vars_2D: ["SP", "t2m", "V500", "U500", "T500", "Z500", "Q500"]
          path: "/glade/campaign/cisl/aiml/credit/era5_zarr/SixHourly_y_TOTAL_%Y-*"
        dynamic_forcing:
          vars_2D: ["tsi"]
          path: "/glade/campaign/cisl/aiml/credit/credit_solar_nc_6h_0.25deg/solar_irradiance_%Y*.nc"
        static:
          vars_2D: ["Z_GDS4_SFC", "LSM"]
          path: "/glade/campaign/cisl/aiml/credit/static_scalers/static_norm_old.nc"
        diagnostic: null

  timestep: "6h"
  forecast_len: 3
  start_datetime: "2015-01-01"
  end_datetime: "2016-12-31"

validation_data:
  timestep: "6h"
  forecast_len: 3
  start_datetime: "2017-01-01"
  end_datetime: "2018-12-31"

preblocks:
  per_step:
    scaler:
      type: bridgescaler_transform
      args:
        scaler_path: /glade/campaign/cisl/aiml/credit/bridgescaler/wxformer_025deg_gen2_pre_scaler.json
        variables:
        - ERA5/prognostic/3d/U
        - ERA5/prognostic/3d/V
        - ERA5/prognostic/3d/T
        - ERA5/prognostic/3d/Q
        - ERA5/prognostic/2d/SP
        - ERA5/prognostic/2d/t2m
        - ERA5/prognostic/2d/V500
        - ERA5/prognostic/2d/U500
        - ERA5/prognostic/2d/T500
        - ERA5/prognostic/2d/Z500
        - ERA5/prognostic/2d/Q500
        - ERA5/dynamic_forcing/2d/tsi
        method: transform
    concat:
      type: concat

postblocks:
  per_step:
    reconstruct:
      type: reconstruct
    scaler:
      type: bridgescaler_transform
      args:
        scaler_path: /glade/campaign/cisl/aiml/credit/bridgescaler/wxformer_025deg_gen2_post_scaler.json
        variables:
        - ERA5/prognostic/3d/U
        - ERA5/prognostic/3d/V
        - ERA5/prognostic/3d/T
        - ERA5/prognostic/3d/Q
        - ERA5/prognostic/2d/SP
        - ERA5/prognostic/2d/t2m
        - ERA5/prognostic/2d/V500
        - ERA5/prognostic/2d/U500
        - ERA5/prognostic/2d/T500
        - ERA5/prognostic/2d/Z500
        - ERA5/prognostic/2d/Q500
        method: inverse_transform

model:
    type: "wxformer_next_looped"
    frames: 1
    image_height: 640
    image_width: 1280
    levels: 16
    channels: 4
    surface_channels: 7
    input_only_channels: 3
    output_only_channels: 0

    dim: [8, 16, 32, 64]
    dim_head: 8
    depth: [2, 2, 2, 2]
    global_window_size: [10, 5, 2, 1]
    local_window_size: [10, 5, 2, 2]
    cross_embed_kernel_sizes:
    - [4, 8, 16, 32]
    - [2, 4]
    - [2, 4]
    - [2, 4]
    cross_embed_strides: [2, 2, 2, 2]

    col_attn_heads: 4
    decoder_col_attn: True
    num_spectral_nodes: 64

    # ---- Looped-bottleneck-specific (Experiment A, docs/looped_transformer_claude_handoff.md) ----
    bottleneck_loops: 2
    bottleneck_loop_depth: 1
    loop_gate_init: 0.1

    use_spectral_norm: True

loss:
    training_loss: "mse"
    validation_loss: "mse"
    use_power_loss: False
    use_spectral_loss: False
    use_latitude_weights: True
    latitude_weights: '/glade/campaign/cisl/aiml/credit/static_scalers/LSM_static_variables_ERA5_zhght.nc'
    use_variable_weights: False

trainer:
    type: gen2

    parallelism:
        data: none          # single GPU
        tensor: 1
        domain: 1

    load_weights: False
    load_optimizer: False
    load_scaler: False
    load_scheduler: False

    save_backup_weights: False
    save_best_weights: True
    save_metric_vars: True

    update_learning_rate: False
    learning_rate: 1.0e-03
    weight_decay: 0

    train_batch_size: 1
    valid_batch_size: 1
    ensemble_size: 1

    batches_per_epoch: 5
    valid_batches_per_epoch: 2
    stopping_patience: 50
    skip_validation: False

    start_epoch: 0
    reload_epoch: False
    epochs: 2

    use_scheduler: True
    scheduler:
      scheduler_type: cosine-annealing-restarts
      first_cycle_steps: 50
      cycle_mult: 1.0
      max_lr: 1.0e-03
      min_lr: 1.0e-06
      warmup_steps: 10
      gamma: 1.0

    amp: False
    grad_accum_every: 1
    grad_max_norm: 1.0

    thread_workers: 4
    valid_thread_workers: 2
    prefetch_factor: 2

# ---- Inference (used by rollout_gen2.py, not training) ---- #
inference:
    run_mode: batch               # batch | single
    mode: none                    # none | ddp | fsdp2  (distributed inference backend)
    save_forecast: '/glade/derecho/scratch/$USER/credit_tests/smoke_wxformer_next_looped/rollout'
    batch_forecast:               # active when run_mode: batch
        forecast_length: "4d"     # forecast duration per init (e.g. "10d", "1m", "1y")
        first_init_date: "2017-01-01"      # first init time (inclusive), ISO 8601
        last_init_date: "2017-01-02"       # last init time (inclusive)
        init_interval: "1d"                # interval between init times

    single_forecast:              # active when run_mode: single
        forecast_length: "4d"     # forecast duration
        start_datetime: "2017-01-01T00:00Z"   # init time, ISO 8601

    output:
        format: netcdf            # netcdf | zarr
        output_interval: null     # write every Nth step; null = every step (e.g. "6h", "24h")
        group_by: null            # null (per-step) | "day" | "month" | "year" | "full"
        variables: null           # null = save all; or list of {name:, levels:} to subset
        metadata: '/glade/work/schreck/repos/miles-credit-main/credit/metadata/era5.yaml'
        encoding:
            dtype: float32
            zlib: true
            complevel: 4          # 1 (fast) to 9 (small)

pbs:
    conda: "/glade/u/home/schreck/.conda/envs/credit-casper"  # full path — avoids conda init issues in PBS
    job_name: "smoke_wxformer_next_looped"
    project: "NAML0001"
    walltime: "01:00:00"
    ncpus: 8
    ngpus: 1
    mem: "64GB"
    gpu_type: "v100"
