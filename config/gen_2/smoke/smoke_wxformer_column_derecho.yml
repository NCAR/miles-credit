save_loc: '/glade/derecho/scratch/schreck/credit_tests/smoke_wxformer_column'
seed: 1000

data:
  source:
    ERA5:
      dataset_type: "local"
      level_coord: "level"
      levels: [10, 30, 40, 50, 60, 70, 80, 90, 95, 100, 105, 110, 120, 130, 136, 137]
      variables:
        prognostic:
          vars_3D: ["U", "V", "T", "Q"]
          vars_2D: ["SP", "t2m", "V500", "U500", "T500", "Z500", "Q500"]
          path: "/glade/campaign/cisl/aiml/credit/era5_zarr/SixHourly_y_TOTAL_%Y-01-01_*-12-31_staged.zarr"
        dynamic_forcing:
          vars_2D: ["tsi"]
          path: "/glade/campaign/cisl/aiml/credit/credit_solar_nc_6h_0.25deg/solar_irradiance_%Y-*.nc"
        static:
          vars_2D: ["Z_GDS4_SFC", "LSM"]
          path: "/glade/campaign/cisl/aiml/credit/static_scalers/static_norm_old.nc"
        diagnostic: null

  timestep: "6h"
  forecast_len: 1
  start_datetime: "2015-01-01"
  end_datetime: "2016-12-31"

validation_data:
  start_datetime: "2017-01-01"
  end_datetime: "2018-12-31"
  timestep: "6h"
  forecast_len: 1

preblocks:
  per_step:
    norm:
      type: era5_normalizer
      args:
        mean_path: "/glade/campaign/cisl/aiml/credit/static_scalers/mean_6h_1979_2018_16lev_0.25deg.nc"
        std_path:  "/glade/campaign/cisl/aiml/credit/static_scalers/std_6h_1979_2018_16lev_0.25deg.nc"
    concat:
      type: concat

postblocks:
  per_step:
    reconstruct:
      type: reconstruct
      args:
        detach: false
    reconstruct_target:
      type: reconstruct
      args:
        in_key: 'y'
        out_key: 'y_target_processed'

model:
    type: "wxformer_column"
    frames: 1
    image_height: 640
    image_width: 1280
    levels: 16
    channels: 4
    surface_channels: 7
    input_only_channels: 3
    output_only_channels: 0

    dim: [8, 16, 32, 64]
    dim_head: 8
    depth: [2, 2, 2, 2]
    global_window_size: [10, 5, 2, 1]
    local_window_size: [10, 5, 2, 2]
    cross_embed_kernel_sizes:
    - [4, 8, 16, 32]
    - [2, 4]
    - [2, 4]
    - [2, 4]
    cross_embed_strides: [2, 2, 2, 2]

    col_attn_heads: 4
    decoder_col_attn: True
    num_spectral_nodes: 64

    use_spectral_norm: True

loss:
    training_loss: "mse"
    validation_loss: "mse"
    use_power_loss: False
    use_spectral_loss: False
    use_latitude_weights: True
    latitude_weights: '/glade/campaign/cisl/aiml/credit/static_scalers/LSM_static_variables_ERA5_zhght.nc'
    use_variable_weights: False

trainer:
    type: era5-gen2
    mode: none

    parallelism:
        data: none
        tensor: 1
        domain: 1

    load_weights: False
    load_optimizer: False
    load_scaler: False
    load_scheduler: False

    save_backup_weights: False
    save_best_weights: False

    learning_rate: 1.0e-04
    weight_decay: 0

    train_batch_size: 1
    valid_batch_size: 1

    batches_per_epoch: 20
    valid_batches_per_epoch: 5
    stopping_patience: 999
    skip_validation: False

    start_epoch: 0
    epochs: 1

    use_scheduler: False

    amp: True
    grad_max_norm: 1.0

    thread_workers: 2
    valid_thread_workers: 1
    prefetch_factor: 2
