name: Bug report
description: Report something in CREDIT that is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! The **Steps to reproduce** section is required: the PR
        that fixes this issue will be checked against these exact steps, so the more precisely
        they recreate the problem, the faster it can be fixed and verified.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        The minimal sequence of commands (and config, if relevant) that triggers the bug,
        starting from a fresh checkout or install. Reviewers re-run these steps to confirm a fix.
        Use generic paths (e.g. `/glade/derecho/scratch/$USER/...`) and point to shared data
        (`/glade/campaign/aiml/credit/` or a cloud URL) rather than private files.
      placeholder: |
        1. pip install -e . --no-deps   (commit abc1234)
        2. credit check -c config/gen_2/examples/example-end-to-end.yml
        3. credit rollout -c config/gen_2/examples/example-end-to-end.yml --init-time 2020-06-01T00
        4. See error below
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error output
      description: What happened instead. Paste the full traceback or log output (it is formatted automatically).
      render: shell
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Config
      description: The relevant parts of your YAML config (or the whole file), if the bug depends on it.
      render: yaml

  - type: dropdown
    id: stage
    attributes:
      label: Pipeline stage
      multiple: true
      options:
        - Config / credit begin / credit check
        - Preprocessing
        - Training
        - Inference / rollout
        - Realtime
        - Plotting / metrics
        - Job submission (credit submit / PBS)
        - Installation
        - Documentation
        - Other

  - type: dropdown
    id: generation
    attributes:
      label: Pipeline generation
      options:
        - Gen 2
        - Gen 1
        - Not sure

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Compute platform (Casper, Derecho, laptop, cloud VM, ...), CPU or GPU and GPU type,
        CREDIT version or commit (`git rev-parse --short HEAD`), and versions of Python,
        PyTorch, CUDA and NCCL where relevant.
      placeholder: |
        Platform: Derecho, 4x A100
        CREDIT commit: abc1234
        Python 3.12, torch 2.5.1, CUDA 12.4, NCCL 2.21
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help, such as whether it worked on an earlier version or a workaround you found.
