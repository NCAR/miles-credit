name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{matrix.python-version}}
          cache: 'pip'
    #  - name: ESMF support Package Install
    #    run: |
    #      sudo apt-get -qq -y update
    #      sudo apt -qq install libnetcdf-dev libnetcdff-dev
    #  - name: Install ESMF
    #    uses: esmf-org/install-esmf-action@39afafec8570201bcf14ccdba7ffc246278f8d21 # v1.0.2
    #    env:
    #      ESMF_NETCDF: nc-config
    #    with:
    #      version: 8.9.1
    #      esmpy: true
    #      cache: false
    #  - name: Print ESMF Info
    #    run: |
    #      cat ${ESMFMKFILE}
      - name: Install dependencies
        run: | 
          python -m pip install --upgrade pip 
          pip install uv
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu --system
          uv pip install ".[develop]" --system
          uv pip install pytest pytest-cov --system
    #      pip install xesmf
      - name: Run tests
        run: |
          pytest --cov=credit --cov-branch --cov-report=xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
            env_vars: PYTHON
            token: ${{ secrets.CODECOV_TOKEN }}


  # Core CREDIT (no extras) must install and import gen1 models without
  # torch-harmonics / segmentation-models-pytorch -- see NCAR/miles-credit#519.
  minimal-deps:
    name: core install without optional extras
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: 'pip'
      - name: Install core dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu --system
          uv pip install . pytest --system
      - name: Optional extras are absent
        run: |
          python -c "import importlib.util as u; found = [m for m in ('torch_harmonics', 'segmentation_models_pytorch') if u.find_spec(m)]; assert not found, f'unexpectedly installed: {found}'"
      - name: Import gen1 models
        run: |
          python -c "from credit.models.camulator import Camulator; from credit.models.fuxi import Fuxi; from credit.models.crossformer import CrossFormer"
      - name: Run optional-dependency tests
        run: |
          pytest tests/test_optional_deps.py
